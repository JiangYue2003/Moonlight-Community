[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mysql]
command=/usr/bin/mysqld --user=root --datadir=/var/lib/mysql --bind-address=0.0.0.0
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/mysql.log
stderr_logfile=/var/log/supervisor/mysql_err.log

[program:redis]
command=/usr/bin/redis-server --bind 0.0.0.0 --port 6379
autostart=true
autorestart=true
priority=2
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log

[program:etcd]
command=/usr/bin/etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://127.0.0.1:2379
autostart=true
autorestart=true
priority=3
stdout_logfile=/var/log/supervisor/etcd.log
stderr_logfile=/var/log/supervisor/etcd_err.log

[program:user-rpc]
command=/app/bin/user-rpc -f /app/services/user/rpc/etc/user.yaml
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/user-rpc.log
stderr_logfile=/var/log/supervisor/user-rpc_err.log
startsecs=5

[program:storage-rpc]
command=/app/bin/storage-rpc -f /app/services/storage/cmd/storage/etc/storage.yaml
directory=/app
autostart=true
autorestart=true
priority=11
stdout_logfile=/var/log/supervisor/storage-rpc.log
stderr_logfile=/var/log/supervisor/storage-rpc_err.log
startsecs=5

