Name: counter.rpc
ListenOn: 0.0.0.0:9003
Etcd:
  Hosts:
  - etcd:2379
  Key: counter.rpc
Mode: dev
Redis:
  Host: redis:6379
  Type: node
  Key: counter-rpc
Kafka:
  Brokers:
  - kafka:29092
  Topic: counter-events
  Producer:
    LingerMs: 10
Rebuild:
  Enabled: false
  Lock:
    TtlMs: 5000
  Rate:
    Permits: 3
    WindowSeconds: 10
  Backoff:
    BaseMs: 500
    MaxMs: 30000
Log:
  ServiceName: counter.rpc
  Mode: console
  Level: info
Prometheus:
  Host: 0.0.0.0
  Port: 9103
  Path: /metrics
