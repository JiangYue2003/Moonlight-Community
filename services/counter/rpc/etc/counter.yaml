Name: counter.rpc
ListenOn: 0.0.0.0:9003

Mode: dev

# Etcd 服务注册配置
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: counter.rpc

Redis:
  Host: 127.0.0.1:6379
  Type: node
  Key: counter-rpc

Kafka:
  Brokers:
  - 127.0.0.1:9092
  Topic: counter-events

Log:
  ServiceName: counter.rpc
  Mode: console
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9103
  Path: /metrics
