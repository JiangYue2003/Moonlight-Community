DisableAPI: true

DebugHTTP:
  Enabled: true
  ListenOn: 0.0.0.0:6066

Api:
  Name: relation-api
  Host: 0.0.0.0
  Port: 8006

  Mode: dev

  AuthRpc:
    Etcd:
      Hosts:
      - etcd:2379
      Key: user.rpc
    NonBlock: true

  RelationRpc:
    Etcd:
      Hosts:
      - etcd:2379
      Key: relation.rpc
    NonBlock: true

  UserCounterRpc:
    Etcd:
      Hosts:
      - etcd:2379
      Key: counter.rpc
    NonBlock: true

  Log:
    ServiceName: relation-api
    Mode: console
    Level: info

  Prometheus:
    Host: 0.0.0.0
    Port: 9116
    Path: /metrics

Rpc:
  Name: relation.rpc
  ListenOn: 0.0.0.0:9006

  # Etcd 服务注册配置
  Etcd:
    Hosts:
    - etcd:2379
    Key: relation.rpc

  Mode: dev

  Mysql:
    DataSource: root:Zz123456@tcp(mysql:3306)/zhiguang?charset=utf8mb4&parseTime=true&loc=Local

  CacheRedis:
  - Host: redis:6379
    Type: node

  Redis:
    Host: redis:6379
    Type: node
    Key: relation-rpc

  UserRpc:
    Endpoints:
    - user-storage:9002
    NonBlock: true

  RateLimit:
    FollowCapacity: 100
    FollowRefillPerSec: 1

  Snowflake:
    WorkerId: 1
    DatacenterId: 3

  Log:
    ServiceName: relation.rpc
    Mode: console
    Level: info

  Prometheus:
    Host: 0.0.0.0
    Port: 9105
    Path: /metrics

Syncer:
  Mysql:
    DataSource: root:Zz123456@tcp(mysql:3306)/zhiguang?charset=utf8mb4&parseTime=true&loc=Local

  CacheRedis:
  - Host: redis:6379
    Type: node

  Redis:
    Host: redis:6379
    Type: node
    Pass: ""

  Kafka:
    Brokers:
    - kafka:29092
    Topic: canal-outbox
    GroupId: relation-syncer
    AutoOffsetReset: latest

  UserCounterRpc:
    Endpoints:
    - counter:9003

  Dedup:
    TtlSeconds: 86400

  ZSet:
    MaxMembers: 2000
    TtlSeconds: 7200

  Snowflake:
    WorkerId: 2
    DatacenterId: 3

  Log:
    ServiceName: relation-syncer
    Mode: console
