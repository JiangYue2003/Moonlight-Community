DisableAPI: true

Api:
  Name: search-api
  Host: 0.0.0.0
  Port: 8007

  Mode: dev

  AuthRpc:
    Etcd:
      Hosts:
      - etcd:2379
      Key: user.rpc
    NonBlock: true

  Es:
    Addrs:
    - http://elasticsearch:9200
    TimeoutMs: 10000

  ContentIndex: zhiguang_content_index

  Log:
    ServiceName: search-api
    Mode: console
    Level: info

  Prometheus:
    Host: 0.0.0.0
    Port: 9117
    Path: /metrics

Rpc:
  Name: search.rpc
  ListenOn: 0.0.0.0:9017

  # Etcd 服务注册配置
  Etcd:
    Hosts:
    - etcd:2379
    Key: search.rpc

  Mode: dev

  CounterRpc:
    Endpoints:
    - counter:9003
    NonBlock: true

  Es:
    Addrs:
    - http://elasticsearch:9200
    TimeoutMs: 10000

  ContentIndex: zhiguang_content_index

  Log:
    ServiceName: search-rpc
    Mode: console
    Level: info

  Prometheus:
    Host: 0.0.0.0
    Port: 9107
    Path: /metrics

Indexer:
  Es:
    Addrs:
    - http://elasticsearch:9200
    TimeoutMs: 10000

  ContentIndex: zhiguang_content_index

  Kafka:
    Brokers:
    - kafka:29092
    Topic: canal-outbox
    GroupId: search-indexer
    AutoOffsetReset: latest

  KnowPostRpc:
    Endpoints:
    - knowpost:9004
    NonBlock: true

  Redis:
    Host: redis:6379
    Type: node

  Dedup:
    TtlSeconds: 600

  ContentMaxRunes: 4000
  HttpFetchTimeoutMs: 5000

  Log:
    ServiceName: search.indexer
    Mode: console
    Level: info
