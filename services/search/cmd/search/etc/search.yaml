Rpc:
  Name: search.rpc
  ListenOn: 0.0.0.0:9017

  # Etcd 服务注册配置
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: search.rpc

  Mode: dev

  CounterRpc:
    Etcd:
      Hosts:
      - 127.0.0.1:2379
      Key: counter.rpc
    NonBlock: true

  Es:
    Addrs:
    - http://127.0.0.1:9200
    TimeoutMs: 10000

  ContentIndex: zhiguang_content_index

  Log:
    ServiceName: search-rpc
    Mode: console
    Level: info

  Prometheus:
    Host: 0.0.0.0
    Port: 9107
    Path: /metrics

Indexer:
  Es:
    Addrs:
    - http://127.0.0.1:9200
    TimeoutMs: 10000

  ContentIndex: zhiguang_content_index

  Kafka:
    Brokers:
    - 127.0.0.1:9092
    Topic: canal-outbox
    GroupId: search-indexer
    AutoOffsetReset: latest

  KnowPostRpc:
    Etcd:
      Hosts:
      - 127.0.0.1:2379
      Key: knowpost.rpc
    NonBlock: true

  Redis:
    Host: 127.0.0.1:6379
    Type: node

  Dedup:
    TtlSeconds: 600

  ContentMaxRunes: 4000
  HttpFetchTimeoutMs: 5000

  Log:
    ServiceName: search.indexer
    Mode: console
    Level: info
